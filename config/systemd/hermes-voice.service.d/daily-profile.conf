[Unit]
Description=RiverBank local hands-free Hermes voice surface (daily profile)

[Service]
WorkingDirectory=@RIVERBANK_HOME@/.hermes/profiles/daily/workspace
RuntimeDirectory=hermes-voice-control
RuntimeDirectoryMode=0750
Environment="RIVERBANK_DAILY_HOME=@RIVERBANK_HOME@/.hermes/profiles/daily"
ExecStart=
ExecStart=@RIVERBANK_HOME@/.hermes/hermes-agent/venv/bin/python @RIVERBANK_REPO@/apps/expression-ui/daily_voice_assistant.py
