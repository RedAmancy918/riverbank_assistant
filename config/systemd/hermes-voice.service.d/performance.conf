[Service]
# Keep the full voice stack warm and make the foreground interaction win any
# short CPU or storage contention without stopping the resident UI/camera/Hailo.
CPUWeight=10000
IOWeight=1000
Nice=-5
Environment="HF_HUB_OFFLINE=1"
Environment="RIVERBANK_WHISPER_POOL_SIZE=2"
Environment="RIVERBANK_DAILY_AGENT_MAX_TURNS=12"
Environment="RIVERBANK_DAILY_TOOLSETS=browser,clarify,cronjob,file,memory,session_search,skills,todo,vision,web"
Environment="RIVERBANK_DAILY_AGENT_TIMEOUT=75"
Environment="RIVERBANK_FLIGHT_HTTP_TIMEOUT=18"
Environment="RIVERBANK_FLIGHT_WORKERS=4"
