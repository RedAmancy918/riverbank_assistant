[Service]
# ProtectSystem=strict also makes the user runtime tree read-only inside this
# service.  Allow only the handoff state directory so status can be committed
# without weakening the rest of the sandbox.
ReadWritePaths=/run/user/@RIVERBANK_UID@

# The lightweight handoff uses GTK directly on the compositor's native Wayland
# socket, avoiding both pygame display enumeration and X11 cookie readiness.
Environment="GDK_BACKEND=wayland"
Environment="NO_AT_BRIDGE=1"
Environment="GIO_USE_VFS=local"
