name: RiverBankMobile
options:
  bundleIdPrefix: com.riverbank
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.25.1"
    CURRENT_PROJECT_VERSION: "2"
targets:
  RiverBankMobile:
    type: application
    platform: iOS
    sources:
      - path: RiverBankMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.riverbank.assistant
        PRODUCT_NAME: RiverBank
        INFOPLIST_FILE: RiverBankMobile/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
    scheme:
      testTargets: []
